[project]
name = "renderforge"
version = "0.1.0"
description = "RenderDoc capture -> Unreal Engine 5.8 scene reconstruction workbench"
requires-python = ">=3.12"
dependencies = ["numpy", "pillow"]

[tool.setuptools]
packages = ["renderforge", "renderforge.web", "renderforge.adapters"]

[tool.setuptools.package-data]
"renderforge.web" = ["static/*", "static/*/*", "static/*/*/*", "static/*/*/*/*"]
